name: Compile LaTeX
on:
  workflow_call:
    inputs:
      main-file:
        required: true
        type: string

run-name: Build CV in ${{ inputs.main-file == 'main-pt.tex' && 'portuguese' || 'english' }}

jobs:
  generate-CV:
    runs-on: ubuntu-latest
    container: kjarosh/latex:2024.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build using latexmk
        run: latexmk -pdf -output-directory=out ${{ inputs.main-file }}

      - name: Upload document
        uses: actions/upload-artifact@v4
        with:
          name: main-document
          path: out/*.pdf